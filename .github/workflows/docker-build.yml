name: CI/CD Pipeline

env:
  IMAGE_NAME: docmost
  # single-arch on purpose: the k3s nodes are amd64 and QEMU cross-builds are slow
  PLATFORMS: linux/amd64

  K8S_NAMESPACE: docmost-k3s
  K8S_DEPLOYMENT: docmost
  K8S_SERVICE: docmost
  DEPLOY_VERSION: dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  ci:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            # type=ref 會把 feat/x 這種分支名消毒成 feat-x;type=raw 不會,
            # 而含 '/' 的 tag 會讓 push 直接失敗
            type=ref,event=branch
            type=sha,format=short,prefix={{branch}}-
            # latest 只跟著 dev 走,手動建的 feature branch 不該蓋掉它
            type=raw,value=latest,enable=${{ github.ref_name == 'dev' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Image digest
        run: |
          echo "Pushed ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"

  deploy:
    name: Deploy to K8s
    needs: ci
    # 只有 dev 自動部署。手動 dispatch 其他分支時只建 image,
    # 不去動 k3s 上跑著的東西。
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via webhook
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS -X POST "${{ secrets.K8S_MANAGER_URL }}/api/webhook/deploy" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"service\": \"${{ env.K8S_SERVICE }}\",
              \"namespace\": \"${{ env.K8S_NAMESPACE }}\",
              \"deployment\": \"${{ env.K8S_DEPLOYMENT }}\",
              \"version\": \"${{ env.DEPLOY_VERSION }}\",
              \"force\": true,
              \"branch\": \"${{ github.ref_name }}\",
              \"commitSha\": \"${{ github.sha }}\",
              \"ciPipeline\": \"github-actions\",
              \"triggeredBy\": \"${{ github.actor }}\"
            }" \
            -w "\n%{http_code}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "$BODY"
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Deployment webhook failed"
            exit 1
          fi

          echo "Deployment triggered"
