name: CI/CD Pipeline

# ===== 可配置變數 =====
env:
  BRANCH_NAME: dev                    # 觸發的分支名稱
  IMAGE_NAME: docmost                 # Docker image 名稱
  PLATFORMS: linux/amd64              # 支援的平台

  # K8s 部署配置
  K8S_NAMESPACE: docmost-k3s          # K8s namespace
  K8S_DEPLOYMENT: docmost             # Deployment 名稱
  K8S_SERVICE: docmost                # 服務名稱
  DEPLOY_VERSION: dev                 # 部署版本標籤

# ===== 觸發條件 =====
on:
  push:
    branches:
      - dev  # 當 push 到 dev 分支時觸發
  workflow_dispatch:  # 允許手動觸發

jobs:
  # ========================================
  # CI: 建置和推送 Docker Image
  # ========================================
  ci:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 QEMU (支援多平台 build)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 設定 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登入 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 提取 metadata (tags, labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.BRANCH_NAME }}
            type=raw,value=${{ env.BRANCH_NAME }}-{{sha}}

      # 6. Build 並 Push Docker Image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # 7. 顯示 build 結果
      - name: Image digest
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Image pushed to: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"

  # ========================================
  # CD: 部署到 Kubernetes
  # ========================================
  deploy:
    name: Deploy to K8s
    needs: ci  # 依賴 CI job
    runs-on: ubuntu-latest

    steps:
      # 1. 通知 K8s Manager 進行自動部署
      - name: Deploy via Webhook
        run: |
          echo "🚀 Deploying to Kubernetes..."
          echo "📦 Service: ${{ env.K8S_SERVICE }}"
          echo "🏠 Namespace: ${{ env.K8S_NAMESPACE }}"
          echo "🚢 Deployment: ${{ env.K8S_DEPLOYMENT }}"
          echo "🏷️  Version: ${{ env.DEPLOY_VERSION }}"
          echo ""

          # 發送 Webhook 請求
          RESPONSE=$(curl -X POST "${{ secrets.K8S_MANAGER_URL }}/api/webhook/deploy" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"service\": \"${{ env.K8S_SERVICE }}\",
              \"namespace\": \"${{ env.K8S_NAMESPACE }}\",
              \"deployment\": \"${{ env.K8S_DEPLOYMENT }}\",
              \"version\": \"${{ env.DEPLOY_VERSION }}\",
              \"force\": true,
              \"branch\": \"${{ github.ref_name }}\",
              \"commitSha\": \"${{ github.sha }}\",
              \"ciPipeline\": \"github-actions\",
              \"triggeredBy\": \"${{ github.actor }}\"
            }" \
            -w "\n%{http_code}" \
            -s)

          # 分離 HTTP 狀態碼和回應內容
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "📡 Webhook Response:"
          echo "----------------------------------------"
          echo "$BODY"
          echo "----------------------------------------"
          echo "HTTP Status: $HTTP_CODE"
          echo ""

          # 檢查 HTTP 狀態碼
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ Deployment webhook triggered successfully!"
            echo "🎉 Deployment is in progress"
            echo ""
            echo "👉 Check deployment status at:"
            echo "   ${{ secrets.K8S_MANAGER_URL }}/deployments/${{ env.K8S_NAMESPACE }}/${{ env.K8S_DEPLOYMENT }}"
            exit 0
          else
            echo "❌ Deployment webhook failed with HTTP $HTTP_CODE"
            echo "📋 Response body:"
            echo "$BODY"
            exit 1
          fi
