name: Build and Push Docker Image

# ===== 可配置變數 =====
env:
  BRANCH_NAME: dev                    # 觸發的分支名稱
  IMAGE_NAME: docmost                 # Docker image 名稱
  PLATFORMS: linux/amd64  # 支援的平台

# ===== 觸發條件 =====
on:
  push:
    branches:
      - dev  # 當 push 到 dev 分支時觸發
  workflow_dispatch:  # 允許手動觸發

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout 程式碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 設定 QEMU (支援多平台 build)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 設定 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登入 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 提取 metadata (tags, labels)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.BRANCH_NAME }}
            type=raw,value=${{ env.BRANCH_NAME }}-{{sha}}

      # 6. Build 並 Push Docker Image
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      # 7. 顯示 build 結果
      - name: Image digest
        run: |
          echo "✅ Build completed successfully!"
          echo "📦 Image pushed to: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"
          echo "🏷️  Tags: ${{ steps.meta.outputs.tags }}"
